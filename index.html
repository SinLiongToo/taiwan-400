<title>台灣四百年</title>

<style>
/* Layout: a single "film" canvas (map + charts + timeline, recordable as video) with a control deck beneath it. One deliberate dark sea-ink look. */
:root {
  color-scheme: dark;
  --bg: #08151d;
  --panel: #0e212c;
  --line: #21404f;
  --ink: #ece6d6;
  --muted: #8fa6b0;
  --gold: #ecd04f;
  --focus: #7fd3d0;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 14px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.head h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4vw, 38px); margin: 0; letter-spacing: .04em; text-wrap: balance; line-height: 1.25; }
.head p { margin: 0; color: var(--muted); max-width: 66ch; }
.stage { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
canvas#film { display: block; width: 100%; height: auto; max-width: 100%; }
.wrap > * { min-width: 0; }
.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.deck .scrub { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.deck .grp { display: inline-flex; align-items: center; gap: 8px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); }
output { font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 4ch; color: var(--gold); font-weight: 600; }
button, select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button.primary { background: var(--gold); color: #1a1505; border-color: var(--gold); font-weight: 700; min-width: 5.5em; }
button.primary .en { color: #4a3f10; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button + button { border-left: 0; }
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button[aria-pressed="true"] { background: var(--line); }
.lbl { color: var(--muted); font-size: 13px; letter-spacing: .06em; }
.eras { display: flex; flex-wrap: wrap; gap: 8px; }
.eras button { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.eras i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.rec { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13px; }
.rec a { color: var(--gold); font-weight: 700; }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 32px; color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 16px; }
.notes h2 { font-family: var(--f-display); color: var(--ink); font-size: 16px; margin: 0 0 4px; letter-spacing: .05em; }
.notes p, .notes ul { margin: 0; }
.notes ul { padding-left: 1.1em; }
.notes > div { min-width: 0; }
.notes summary { cursor: pointer; color: var(--ink); margin-top: 6px; }
.notes .credits { grid-column: 1 / -1; }
#credits { columns: 2 280px; column-gap: 32px; font-size: 12.5px; margin-top: 8px; }
#credits li { break-inside: avoid; }
#credits a { color: var(--muted); }
.feature { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 22px; align-items: center; padding: 16px 18px; border: 1px solid #5a2a31; border-radius: 6px; background: #1a1418; color: var(--ink); text-decoration: none; }
.feature:hover { border-color: #c8323c; }
.feature .f-date { font-family: var(--f-mono); color: #e06a70; font-weight: 600; font-variant-numeric: tabular-nums; }
.feature strong { display: block; font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; }
.feature .f-body > span { color: var(--muted); font-size: 14px; display: block; }
.feature .f-go { font-size: 22px; color: #e06a70; }
.feature .en { display: block; margin-left: 0; }
@media (max-width: 560px) { .feature { grid-template-columns: minmax(0, 1fr) auto; } .feature .f-date { grid-column: 1 / -1; } }
/* bilingual: English rides beside or under the Chinese */
.en { color: var(--muted); font-size: .86em; margin-left: .45em; font-weight: 400; letter-spacing: 0; }
h1 .en { display: block; margin-left: 0; font-size: .46em; font-family: var(--f-body); letter-spacing: .02em; }
p .en, li .en, h2 .en, summary .en { display: block; margin-left: 0; }
h2 .en { font-family: var(--f-body); font-size: .78em; }

<main class="wrap">

        <ul id="credits"></ul>
      </details>
    </div>
  </section>
</main>

<script src="portraits.js"></script>
<script>
(() => {
// ---------- language ----------
let lang = 'bi';
try { const s = localStorage.getItem('tw400-lang'); if (s==='zh'||s==='en'||s==='bi') lang = s; } catch (e) {}
if (['#zh','#en','#bi'].includes(location.hash)) lang = location.hash.slice(1);
const tx = (zh, en) => lang==='en' ? en : zh;                          // one language
const bil = (zh, en) => lang==='en' ? en : lang==='bi' ? `${zh} ${en}` : zh; // inline pair

const UI = {
  h1: ['台灣四百年', 'Taiwan: Four Centuries'],
  intro: ['1600–2026：從南島語族的島嶼，到荷西、明鄭、清、日本與中華民國。看國家權力如何從海岸一路推進到山地，人口組成又如何改變。',
          '1600–2026: from an Austronesian island through Dutch, Spanish, Zheng, Qing, Japanese and Republic of China rule. Watch state power move from the coast into the mountains, and the population change with it.'],
  play: ['播放','Play'], pause: ['暫停','Pause'], replay: ['重播','Replay'],
  speed: ['速度','Speed'], ethLbl: ['族群圖','Population'], pct: ['比例','Share'], abs: ['人數','Count'], langLbl: ['語言','Language'],
  rec: ['錄製影片（1920×1080）','Record video (1920×1080)'], recStop: ['停止錄製','Stop recording'],
  recHint: ['從 1600 年完整播放一次並錄下畫面，約 1 分鐘。錄製時請保持此分頁在前景。','Plays once from 1600 and records it, about a minute. Keep this tab in front while recording.'],
  recNo: ['這個瀏覽器不支援錄製，請改用 Chrome 或 Edge。','This browser can’t record video. Use Chrome or Edge.'],
  recFail: ['無法啟動錄製：','Recording could not start: '],
  recOn: ['錄製中⋯ 請勿切換分頁。','Recording… keep this tab in front.'],
  recDone: ['錄製完成。若在 claude.ai 上無法下載，請用電腦直接開啟這個 HTML 檔錄製。','Done. If the download does nothing on claude.ai, open the HTML file on your computer and record there.'],
  dl: ['下載影片','Download video'],
  n1h: ['地圖怎麼讀','Reading the map'],
  n1: ['每一個點約代表 3 公里見方的土地。綠色是原住民族自主的領域（淺綠為平原、深綠為山地）；其他顏色是當時的統治政權，點越亮越大，代表統治越深入。「國家有效掌握範圍」曲線就是由這些點即時加總出來的。',
       'Each dot is about 3 km square. Green is land under Indigenous self-rule (light for plains, dark for mountains); other colors are the ruling state, and brighter, larger dots mean deeper control. The state-control curve is summed from these dots.'],
  n2h: ['方法與限制','Method and limits'],
  n2: ['統治範圍是依史料整理的示意模型（如清代漢番界線北推、1875 開山撫番、日治理蕃計畫），不是精確疆界。族群人口為各時期估計：1905 年後依日治戶口調查與戰後戶政統計，更早為學界推估。戰後平埔族群多被登記為漢人，並非人口消失。',
       'Control areas are a schematic model drawn from the historical record (the Qing frontier moving north, the 1875 mountain policy, Japan’s aborigine campaigns), not exact borders. Population figures are estimates: censuses from 1905 on, scholarly estimates before. After 1945 most Plains Indigenous people were registered as Han; they did not disappear.'],
  n3h: ['操作','Controls'],
  n3a: ['空白鍵：播放／暫停','Space: play / pause'],
  n3b: ['← →：前後一年；按住 Shift 為十年','← →: one year; hold Shift for ten'],
  n3c: ['錄好的影片若需要 .mov，可用 ffmpeg 轉檔：','To get a .mov file, convert with ffmpeg:'],
  n4h: ['統治者照片','Ruler portraits'],
  n4: ['肖像與照片來自維基共享資源（Wikimedia Commons），多為公有領域，近代總統照片依原授權標示出處。沒有可用自由授權肖像的人物以姓氏字卡代替。',
       'Portraits come from Wikimedia Commons, mostly public domain; recent presidential photos are credited under their licenses. Rulers without a freely licensed portrait get a name card instead.'],
  n4s: ['逐張來源與授權','Source and license for each image'],
  featT: ['專題：二二八與白色恐怖','Feature: 228 and the White Terror'],
  featD: ['1947 年二二八的逐日地圖，以及 1949–1992 年白色恐怖的監獄、刑場與政治案件，和之後的轉型正義。','A day-by-day map of 1947, the prisons, execution grounds and political cases of the 1949–1992 White Terror, and the road to redress.'],
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uiHTML = (zh, en) => lang==='en' ? esc(en) : lang==='bi' ? `${esc(zh)}<span class="en" lang="en">${esc(en)}</span>` : esc(zh);
const uiText = k => tx(UI[k][0], UI[k][1]);
const setK = (el, k) => { el.innerHTML = uiHTML(UI[k][0], UI[k][1]); };

// ---------- palette (canvas) ----------
const COL = { bg:'#08151d', ink:'#ece6d6', muted:'#8fa6b0', faint:'#2a4756', grid:'#16303d', tropic:'#c9a64a' };
const REG = {
  IND:  { n:'原住民族自主領域', e:'Indigenous self-rule', c:'#5aa36f' },
  MING: { n:'明朝（澎湖巡防）', e:'Ming (Penghu patrols)', c:'#b39a7a' },
  VOC:  { n:'荷蘭東印度公司', e:'Dutch East India Co.', c:'#f29a3a' },
  ESP:  { n:'西班牙', e:'Spain', c:'#e57fa8' },
  ZHENG:{ n:'明鄭・東寧', e:'Zheng / Tungning', c:'#b28be6' },
  QING: { n:'大清帝國', e:'Qing Empire', c:'#ecd04f' },
  TWR:  { n:'台灣民主國', e:'Republic of Formosa', c:'#7fd3d0' },
  JPN:  { n:'日本・台灣總督府', e:'Japan (Government-General)', c:'#f0625a' },
  ROC:  { n:'中華民國', e:'Republic of China', c:'#5b95f5' },
};
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
for (const k in REG) REG[k].rgb = hex(REG[k].c);
const IND_LOW = hex('#9ccc84'), IND_HIGH = hex('#3b8a5a');
const REG_KEYS = Object.keys(REG);

// ---------- helpers ----------
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const pw = (y, pts) => {
  if (y <= pts[0][0]) return pts[0][1];
  for (let i=1;i<pts.length;i++) if (y <= pts[i][0]) {
    const [x0,v0]=pts[i-1],[x1,v1]=pts[i]; return v0 + (v1-v0)*(y-x0)/(x1-x0);
  }
  return pts[pts.length-1][1];
};
const COS = Math.cos(23.7*Math.PI/180);
const dist = (c, lon, lat) => Math.hypot((c.lon-lon)*COS, c.lat-lat);

// ---------- geography ----------
const COAST = [[121.54,25.30],[121.62,25.24],[121.74,25.15],[121.85,25.11],[121.92,25.03],[121.83,24.90],[121.82,24.75],[121.86,24.59],[121.78,24.42],[121.70,24.28],[121.62,24.02],[121.58,23.85],[121.50,23.60],[121.45,23.38],[121.37,23.15],[121.25,22.92],[121.15,22.75],[121.02,22.58],[120.95,22.45],[120.90,22.30],[120.86,22.10],[120.85,21.92],[120.75,21.93],[120.70,21.95],[120.72,22.10],[120.62,22.30],[120.50,22.45],[120.38,22.52],[120.27,22.62],[120.20,22.78],[120.13,22.95],[120.10,23.10],[120.08,23.30],[120.13,23.50],[120.20,23.75],[120.30,23.95],[120.40,24.15],[120.52,24.35],[120.68,24.58],[120.85,24.80],[120.98,24.95],[121.10,25.05],[121.28,25.12],[121.40,25.18],[121.54,25.30]];
const SPINE = [[121.55,24.75],[121.35,24.45],[121.18,24.05],[121.02,23.55],[120.90,23.05],[120.83,22.55],[120.79,22.18]];
function pip(x,y,p){ let inside=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const [xi,yi]=p[i],[xj,yj]=p[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
function segDist(px,py,a,b){ const ax=a[0]*COS,ay=a[1],bx=b[0]*COS,by=b[1],x=px*COS; const dx=bx-ax,dy=by-ay; const t=clamp(((x-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1); return Math.hypot(x-(ax+t*dx), py-(ay+t*dy)); }
function spineLon(lat){ const pts=SPINE.map(p=>[p[1],p[0]]).reverse(); return pw(lat,pts); }

const SP = 0.032, DLON = SP/COS, DLAT = SP*0.866;
const cells = [];
for (let r=0, lat=25.34; lat>21.88; lat-=DLAT, r++) {
  for (let lon=119.95+(r%2?DLON/2:0); lon<122.0; lon+=DLON) {
    if (!pip(lon,lat,COAST)) continue;
    let d=9; for(let i=0;i<SPINE.length-1;i++) d=Math.min(d, segDist(lon,lat,SPINE[i],SPINE[i+1]));
    const w = 0.24 + 0.17*Math.exp(-(((lat-23.8)/0.6)**2));
    let m = clamp(1 - d/w, 0, 1);
    m = clamp(m + 0.07*Math.sin(lon*41)*Math.cos(lat*33), 0, 1);
    const yilan = lat>24.45 && lat<24.95 && lon>121.62;
    if (yilan) m *= 0.3;
    const east = lat<24.45 && lon > spineLon(lat)+0.03;
    const lagoon = ((lon-120.19)/0.045)**2 + ((lat-23.04)/0.1)**2 < 1;
    cells.push({lon,lat,m,east,yilan,lagoon});
  }
}
const ISLES = [
  ...[[119.56,23.66],[119.60,23.63],[119.64,23.60],[119.60,23.57],[119.56,23.57],[119.52,23.60],[119.66,23.56],[119.58,23.53],[119.62,23.53],[119.45,23.52],[119.52,23.38],[119.43,23.21]].map(p=>({isle:'penghu',p})),
  ...[[121.53,22.05],[121.56,22.03],[121.54,22.01]].map(p=>({isle:'lanyu',p})),
  ...[[121.49,22.66],[121.48,22.64]].map(p=>({isle:'green',p})),
  {isle:'liuqiu',p:[120.37,22.34]},
];
for (const s of ISLES) cells.push({lon:s.p[0],lat:s.p[1],m:0,east:false,yilan:false,lagoon:false,isle:s.isle});
for (const c of cells) { c.R='IND'; c.K=0; const b=indRGB(c); c.cr=b[0]; c.cg=b[1]; c.cb=b[2]; c.ca=0.5; c.cs=0.8; }
function indRGB(c){ const t=smooth(0.1,0.8,c.m); return [IND_LOW[0]+(IND_HIGH[0]-IND_LOW[0])*t, IND_LOW[1]+(IND_HIGH[1]-IND_LOW[1])*t, IND_LOW[2]+(IND_HIGH[2]-IND_LOW[2])*t]; }

// ---------- control model ----------
let R='IND', K=0;
const set = (r,k) => { R=r; K=k; };
const IND = () => set('IND',0);

function dutchEra(c,y){
  if (y>=1626.4 && y<1642.7) {
    const rk = 0.05 + 0.09*clamp((y-1626.4)/4,0,1);
    if (dist(c,121.74,25.14) < rk) return set('ESP',0.65);
    if (y>=1628.5 && dist(c,121.44,25.17) < 0.11*clamp((y-1628.5)/2,0.4,1)) return set('ESP',0.6);
  }
  if (y>=1642.7) {
    if (dist(c,121.74,25.14)<0.13 || dist(c,121.44,25.17)<0.12) return set('VOC',0.6);
    if (y>=1644 && c.lat>24.9 && c.m<0.3 && dist(c,121.5,25.05)<0.25) return set('VOC',0.3);
  }
  if (y>=1638 && c.m<0.35 && dist(c,121.14,22.76)<0.09) return set('VOC',0.3);
  const ry = pw(y,[[1624.6,0.05],[1630,0.14],[1635,0.22],[1636,0.45],[1642,0.75],[1645,0.95],[1655,1.05]]);
  if (!c.east && c.m<0.3) {
    const d = Math.hypot((c.lat-23.05)/ry, (c.lon-120.2)/(ry*0.6+0.04));
    if (d<1) return set('VOC', 0.3 + 0.55*(1-smooth(0.55,1,d)));
  }
  return IND();
}
function zheng(c,y){
  if (y<1662.09 && dist(c,120.16,23.0)<0.035) return set('VOC',0.9);
  const N = pw(y,[[1661,23.3],[1665,23.6],[1683,23.95]]);
  if (!c.east && !c.yilan && c.m<0.26 && c.lat<N && c.lat>22.42) return set('ZHENG', 0.35 + 0.45*smooth(0,0.25,N-c.lat));
  return IND();
}
function qing(c,y,key){
  const mth = pw(y,[[1683,0.2],[1760,0.28],[1850,0.34],[1875,0.42],[1895,0.46]]);
  const N = pw(y,[[1683,23.5],[1704,23.75],[1723,24.25],[1735,24.7],[1750,25.05],[1760,25.4]]);
  const S = y>=1875 ? 21.8 : 22.38;
  if (c.east) { if (y>=1875 && c.m<0.32) return set(key, 0.3 + 0.2*clamp((y-1875)/13,0,1)); return IND(); }
  if (c.yilan) { if (y>=1812 && c.m<0.45) return set(key, 0.7); return IND(); }
  if (c.m<mth && c.lat<N && c.lat>S) return set(key, 0.35 + 0.45*smooth(0,0.3,N-c.lat)*smooth(0,0.12,mth-c.m));
  return IND();
}
function japan(c,y){
  if (y>1930.82 && y<1931.4 && dist(c,121.13,24.03)<0.1) return IND();
  const mth = pw(y,[[1895,0.46],[1903,0.52],[1906,0.6],[1910,0.7],[1912,0.85],[1915,1.01]]);
  if (c.m < mth) {
    const k = c.m<0.46 ? 0.6 + 0.4*clamp((y-1895.4)/7,0,1) : 0.45 + 0.55*clamp((y-1910)/22,0,1);
    return set('JPN', k);
  }
  return IND();
}
function isle(c,y){
  switch (c.isle) {
    case 'penghu':
      if (y>=1895.2) return set('JPN',1);
      if (y>=1683.55) return set('QING',0.8);
      if (y>=1662.1) return set('ZHENG',0.8);
      if (y>=1624.6) return set('MING',0.5);
      if (y>=1622.5) return set('VOC',0.6);
      return set('MING',0.4);
    case 'liuqiu':
      if (y>=1895.8) return set('JPN',1);
      if (y>=1895.39) return set('TWR',0.6);
      if (y>=1683.6) return set('QING',0.7);
      if (y>=1662.1) return set('ZHENG',0.6);
      if (y>=1636.3) return set('VOC',0.8);
      return IND();
    case 'green':
      if (y>=1895.8) return set('JPN',0.9);
      if (y>=1895.39) return set('TWR',0.4);
      if (y>=1875) return set('QING',0.4);
      return IND();
    case 'lanyu':
      if (y>=1903) return set('JPN', 0.4 + 0.5*clamp((y-1903)/20,0,1));
      return IND();
  }
}
function ctl(c,y){
  if (y>=1945.82) return set('ROC',1);
  if (c.isle) return isle(c,y);
  if (y>=1895.41) {
    const front = 25.45 - clamp((y-1895.41)/(1895.80-1895.41),0,1)*3.7;
    if (y>=1895.80 || c.lat>=front) return japan(c,y);
    return qing(c,1895.3,'TWR');
  }
  if (y>=1895.39) return qing(c,y,'TWR');
  if (y>=1683.6) return qing(c,y,'QING');
  if (y>=1661.33) return zheng(c,y);
  if (y>=1624.6) return dutchEra(c,y);
  return IND();
}

const ctrlSeries = [];
for (let y=Y0; y<=Y1+1e-6; y+=SERIES_STEP) {
  const sum = {}; let tot=0, n=0;
  for (const c of cells) { if (c.isle) continue; n++; ctl(c,y); if (R!=='IND') { sum[R]=(sum[R]||0)+K; tot+=K; } }
  let dom='IND', best=0; for (const k in sum) if (sum[k]>best) { best=sum[k]; dom=k; }
  ctrlSeries.push({ y, pct: tot/n, dom });
}
const ctrlAt = y => ctrlSeries[clamp(Math.round((y-Y0)/SERIES_STEP),0,ctrlSeries.length-1)];

function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function photo(key, name, x, y, w, h, col){
  ctx.save(); rrect(x,y,w,h,3*w/96); ctx.clip();
  const im = key && IMG[key];
  if (im && im.complete && im.naturalWidth) ctx.drawImage(im, x, y, w, h);
  else {
    ctx.fillStyle = col; ctx.globalAlpha *= 0.22; ctx.fillRect(x,y,w,h); ctx.globalAlpha /= 0.22;
    ctx.fillStyle = col; ctx.font = font(900, h*0.42, F.d); ctx.textAlign='center'; ctx.fillText(name[0], x+w/2, y+h*0.64); ctx.textAlign='left';
  }
  ctx.restore();
  ctx.strokeStyle = col; ctx.lineWidth = 1.2; rrect(x,y,w,h,3*w/96); ctx.stroke();
}
function rulerBody(rl, a, r, col){
  if (!rl || a<=0) return;
  const s=r.s, pad=12*s, pw=96*s, ph=120*s, tx0=r.x+pad+pw+14*s, tw=r.x+r.w-pad-tx0, en=lang==='en', bi=lang==='bi';
  const [, role, zhName, zhNote, yrs, key, enName, enNote] = rl;
  ctx.globalAlpha=a;
  photo(key, en ? enName : zhName, r.x+pad, r.y+pad, pw, ph, col);
  ctx.globalAlpha=a;
  const roleTxt = tx(role, ROLE_EN[role]||role);
  fitFont(roleTxt, 700, 12*s, F.b, tw, 9); ctx.fillStyle=col; ctx.fillText(roleTxt, tx0, r.y+pad+13*s);
  const name = en ? enName : zhName;
  fitFont(name, 900, 27*s, F.d, tw, 13); ctx.fillStyle=COL.ink; ctx.fillText(name, tx0, r.y+pad+46*s);
  let yy = r.y+pad+68*s;
  if (bi) { fitFont(enName, 500, 13*s, F.b, tw, 10); ctx.fillStyle=COL.muted; ctx.fillText(enName, tx0, yy); yy += 20*s; }
  ctx.font=font(500,12.5*s,F.m); ctx.fillStyle=COL.ink; ctx.globalAlpha=a*0.8;
  ctx.fillText(en ? yrs.replace('在位 ','r. ') : yrs, tx0, yy); ctx.globalAlpha=a;
  const note = en ? enNote : (bi && zhNote===enName ? '' : zhNote);
  if (note) { ctx.font=font(400,12.5*s,F.b); ctx.fillStyle=COL.muted; wrap(note, tw).slice(0, bi?1:3).forEach((ln,i)=>ctx.fillText(ln, tx0, yy+22*s+i*17*s)); }
  ctx.globalAlpha=1;
}
function drawRuler(y, now){
  const r=L.ruler, s=r.s, rl=rulerAt(y), sb=subAt(y), col=REG[eraAt(y).r].c;
  if (rl!==shownRuler) { prevRuler=shownRuler; shownRuler=rl; rulerT=now; }
  const a = reduce ? 1 : clamp((now-rulerT)/450, 0, 1);
  const h = (12+120+12 + (sb?40:0))*s;
  ctx.fillStyle='rgba(8,21,29,0.86)'; rrect(r.x,r.y,r.w,h,6*s); ctx.fill();
  ctx.strokeStyle=COL.faint; ctx.lineWidth=1; ctx.stroke();
  if (a<1) rulerBody(prevRuler, 1-a, r, col);
  rulerBody(rl, a, r, col);
  if (sb) {
    const yy=r.y+(12+120+10)*s, pad=12*s;
    ctx.strokeStyle=COL.faint; ctx.beginPath(); ctx.moveTo(r.x+pad, yy-2*s); ctx.lineTo(r.x+r.w-pad, yy-2*s); ctx.stroke();
    let x=r.x+pad;
    if (sb[4]) { photo(sb[4], sb[3], x, yy+4*s, 24*s, 30*s, col); x += 34*s; }
    const role = tx(sb[2], ROLE_EN[sb[2]]||sb[2]);
    ctx.font=font(600,11.5*s,F.b); ctx.fillStyle=COL.muted; ctx.fillText(role, x, yy+(lang==='bi'?17:24)*s);
    const rw=ctx.measureText(role).width;
    const nm = tx(sb[3], sb[5]);
    fitFont(nm, 700, 14*s, F.d, r.x+r.w-pad-(x+rw+10*s), 10); ctx.fillStyle=COL.ink; ctx.fillText(nm, x+rw+10*s, yy+(lang==='bi'?17:24)*s);
    if (lang==='bi') { fitFont(sb[5], 400, 11*s, F.b, r.x+r.w-pad-x, 9); ctx.fillStyle=COL.muted; ctx.fillText(sb[5], x, yy+32*s); }
  }
}

function render(y, dt){
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,L.W,L.H);
  const [gx,gy]=P(120.9,23.6); const g=ctx.createRadialGradient(gx,gy,10,gx,gy,M.k*2.2);
  g.addColorStop(0,'rgba(30,70,90,0.35)'); g.addColorStop(1,'rgba(8,21,29,0)'); ctx.fillStyle=g; ctx.fillRect(L.map.x,L.map.y,L.map.w,L.map.h);
  const counts = drawMap(y, dt);
  drawHeader(y); drawEvent(y); drawLegend(counts, y); drawCtrl(y); drawEth(y); drawBand(y); drawRuler(y, performance.now());
}

// ---------- playback ----------
const playBtn=document.getElementById('play'), scrub=document.getElementById('scrub'), out=document.getElementById('yearOut'), speedSel=document.getElementById('speed');
const recBtn=document.getElementById('rec'), recMsg=document.getElementById('recMsg'), dl=document.getElementById('dl');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let year=1600, playing=!reduce, last=performance.now(), holdUntil=0, recMsgKey='recHint', dlExt='';
const rate = y => (y<1620 ? 14 : y<1683.6 ? 5 : y<1860 ? 9 : y<1950 ? 6 : 7);
function setPlaying(p){ playing=p; setK(playBtn, p ? 'pause' : (year>=Y1 ? 'replay' : 'play')); }
function seek(y){ year=clamp(y,Y0,Y1); scrub.value=year; out.textContent=Math.floor(year); }
playBtn.addEventListener('click', ()=>{ if (!playing && year>=Y1) seek(Y0); setPlaying(!playing); });
scrub.addEventListener('input', ()=>{ seek(+scrub.value); if (playing && !recording) setPlaying(false); });
document.addEventListener('keydown', e=>{
  if (e.target.matches('input,select') && e.key!==' ') return;
  if (e.key===' ') { e.preventDefault(); playBtn.click(); }
  else if (e.key==='ArrowRight') { seek(Math.floor(year)+(e.shiftKey?10:1)); }
  else if (e.key==='ArrowLeft') { seek(Math.floor(year)-(e.shiftKey?10:1)); }
});
const pctB=document.getElementById('modePct'), absB=document.getElementById('modeAbs');
function setMode(m){ ethMode=m; pctB.setAttribute('aria-pressed', m==='pct'); absB.setAttribute('aria-pressed', m==='abs'); }
pctB.addEventListener('click', ()=>setMode('pct')); absB.addEventListener('click', ()=>setMode('abs'));

// ---------- language switching (DOM) ----------
const nav=document.getElementById('eras'), credUl=document.getElementById('credits');
const JUMPS = [...ERAS.map(e=>[e.a, e.n, e.ne, REG[e.r].c]), [1949.38,'戒嚴','Martial law',REG.ROC.c], [1987.54,'解嚴','Martial law lifted',REG.ROC.c]];
JUMPS.forEach(j=>{ const b=document.createElement('button'); b.type='button'; b.addEventListener('click', ()=>seek(j[0]+0.01)); nav.appendChild(b); j.el=b; });
function applyLang(){
  document.documentElement.lang = lang==='en' ? 'en' : 'zh-Hant';
  document.querySelectorAll('[data-k]').forEach(el=>setK(el, el.dataset.k));
  setPlaying(playing);
  recBtn.innerHTML = uiHTML(...UI[recording?'recStop':'rec']);
  recMsg.textContent = uiText(recMsgKey);
  if (dlExt) dl.textContent = `${uiText('dl')} (.${dlExt})`;
  JUMPS.forEach(([a,zh,en,c,],i)=>{ JUMPS[i].el.innerHTML = `<i style="background:${c}"></i>${Math.floor(a)} ${uiHTML(zh,en)}`; });
  credUl.innerHTML='';
  const seen=new Set();
  for (const r of RULERS) {
    const key=r[5]; if (!key || !PORTRAITS[key] || seen.has(key)) continue; seen.add(key);
    addCredit(key, bil(r[2], r[6]));
  }
  for (const s of SUBS) { const key=s[4]; if (!key || !PORTRAITS[key] || seen.has(key)) continue; seen.add(key); addCredit(key, bil(s[3], s[5])); }
  for (const [id,l] of [['langZh','zh'],['langEn','en'],['langBi','bi']]) document.getElementById(id).setAttribute('aria-pressed', lang===l);
  cv.setAttribute('aria-label', tx('台灣歷史動畫：地圖、統治者、國家掌握範圍與族群組成','Taiwan history animation: map, rulers, state control and population'));
}
function addCredit(key, name){
  const p=PORTRAITS[key], li=document.createElement('li'), a=document.createElement('a');
  a.href=p.url; a.target='_blank'; a.rel='noopener'; a.textContent=p.file;
  li.append(`${name}: `, a, ` (${p.license}${p.artist ? ', ' + p.artist : ''})`);
  credUl.appendChild(li);
}
function setLang(l){ lang=l; try { localStorage.setItem('tw400-lang', l); } catch (e) {} applyLang(); }
document.getElementById('langZh').addEventListener('click', ()=>setLang('zh'));
document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));
document.getElementById('langBi').addEventListener('click', ()=>setLang('bi'));

function frame(now){
  const dt = Math.min(0.1, (now-last)/1000); last=now;
  if (playing) {
    year += dt * rate(year) * (+speedSel.value);
    if (year>=Y1) { year=Y1; if (recording) { if (!holdUntil) holdUntil=now+2500; } else setPlaying(false); }
    scrub.value=year; out.textContent=Math.floor(year);
  }
  if (recording && holdUntil && now>holdUntil) stopRecording();
  render(year, dt);
  requestAnimationFrame(frame);
}

// ---------- recording ----------
let rec=null, chunks=[];
function setRecMsg(k, extra=''){ recMsgKey=k; recMsg.textContent = uiText(k) + extra; }
recBtn.addEventListener('click', ()=>{
  if (recording) { stopRecording(); return; }
  if (!cv.captureStream || !window.MediaRecorder) { setRecMsg('recNo'); return; }
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t)) || '';
  recording=true; holdUntil=0; setLayout(); seek(Y0);
  chunks=[];
  try { rec=new MediaRecorder(cv.captureStream(30), mime?{mimeType:mime, videoBitsPerSecond:10e6}:{}); }
  catch (err) { recording=false; setLayout(); setRecMsg('recFail', err.message); return; }
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const type = rec.mimeType || mime || 'video/webm'; dlExt = type.includes('mp4') ? 'mp4' : 'webm';
    dl.href = URL.createObjectURL(new Blob(chunks, {type})); dl.download=`taiwan-400.${dlExt}`;
    dl.textContent=`${uiText('dl')} (.${dlExt})`; dl.hidden=false;
    setRecMsg('recDone');
  };
  rec.start(500);
  recBtn.innerHTML = uiHTML(...UI.recStop); setRecMsg('recOn'); dl.hidden=true;
  setPlaying(true);
});
function stopRecording(){
  if (!recording) return;
  recording=false; holdUntil=0;
  if (rec && rec.state!=='inactive') rec.stop();
  recBtn.innerHTML = uiHTML(...UI.rec); setPlaying(false); setLayout();
}

// ---------- boot ----------
new ResizeObserver(()=>{ if (!recording) setLayout(); }).observe(stage);
setLayout(); applyLang(); setPlaying(playing); seek(Y0);
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
</body>
</html>
