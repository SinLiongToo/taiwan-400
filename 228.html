<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="二二八事件 1947：逐日地圖動畫與事件之後的平反歷程。The February 28 Incident, 1947: a day-by-day map and the long road to redress.">
<title>二二八事件 1947</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a day-by-day "film" canvas (date, map, city table, day strip) over a quiet reading column about what came after. Same sea-ink family as 台灣四百年, with a restrained ember/crimson for unrest and violence. */
:root {
  color-scheme: dark;
  --bg: #08151d;
  --panel: #0e212c;
  --line: #21404f;
  --ink: #ece6d6;
  --muted: #8fa6b0;
  --ember: #e8a33d;
  --crimson: #c8323c;
  --focus: #7fd3d0;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 14px; }
.back { color: var(--muted); font-size: 13.5px; text-decoration: none; width: fit-content; }
.back:hover { color: var(--ink); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.head h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4vw, 38px); margin: 0; letter-spacing: .04em; text-wrap: balance; line-height: 1.25; }
.head p { margin: 0; color: var(--muted); max-width: 66ch; }
.stage { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
canvas#film { display: block; width: 100%; height: auto; }
.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.deck .scrub { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.deck .grp { display: inline-flex; align-items: center; gap: 8px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--crimson); }
output { font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 5ch; color: var(--ember); font-weight: 600; }
button, select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button.primary { background: var(--crimson); color: #fff3ef; border-color: var(--crimson); font-weight: 700; min-width: 5.5em; }
button.primary .en { color: #f3c9c4; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button + button { border-left: 0; }
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button[aria-pressed="true"] { background: var(--line); }
.lbl { color: var(--muted); font-size: 13px; letter-spacing: .06em; }
.read { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px 48px; border-top: 1px solid var(--line); padding-top: 22px; }
@media (max-width: 820px) { .read { grid-template-columns: minmax(0, 1fr); } }
.read h2 { font-family: var(--f-display); font-size: 21px; margin: 0 0 12px; letter-spacing: .04em; }
.after { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.after li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.after li:last-child { border-bottom: 0; }
.after b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ember); font-weight: 600; }
.after span { min-width: 0; }
.side { display: grid; gap: 26px; align-content: start; color: var(--muted); }
.side p { margin: 0; }
.toll { font-family: var(--f-display); color: var(--ink); font-size: clamp(30px, 4vw, 42px); font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.side a { color: var(--ink); }
.side ul { margin: 0; padding-left: 1.1em; }
.en { color: var(--muted); font-size: .86em; margin-left: .45em; font-weight: 400; letter-spacing: 0; }
h1 .en { display: block; margin-left: 0; font-size: .46em; font-family: var(--f-body); letter-spacing: .02em; }
p .en, li .en, h2 .en, .after span .en { display: block; margin-left: 0; }
h2 .en { font-family: var(--f-body); font-size: .62em; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="./" data-k="back"></a>
  <div class="head">
    <h1 data-k="h1"></h1>
    <p data-k="intro"></p>
  </div>

  <div class="stage"><canvas id="film" width="1600" height="900"></canvas></div>

  <div class="deck">
    <button id="play" class="primary" type="button"></button>
    <div class="scrub">
      <input id="scrub" type="range" min="0" max="78" step="0.05" value="0" aria-label="Day">
      <output id="dayOut" for="scrub">2/27</output>
    </div>
    <div class="grp">
      <label class="lbl" for="speed" data-k="speed"></label>
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div class="grp">
      <span class="lbl" data-k="langLbl"></span>
      <div class="seg" role="group" aria-label="Language">
        <button id="langZh" type="button" aria-pressed="false" lang="zh-Hant">中文</button>
        <button id="langEn" type="button" aria-pressed="false" lang="en">EN</button>
        <button id="langBi" type="button" aria-pressed="true">中英</button>
      </div>
    </div>
  </div>

  <section class="read">
    <div>
      <h2 data-k="afterH"></h2>
      <ol class="after" id="after"></ol>
    </div>
    <div class="side">
      <div>
        <h2 data-k="tollH"></h2>
        <div class="toll">18,000–28,000</div>
        <p data-k="toll"></p>
      </div>
      <div>
        <h2 data-k="noteH"></h2>
        <p data-k="note"></p>
      </div>
      <div>
        <h2 data-k="moreH"></h2>
        <ul>
          <li><a href="https://www.228.org.tw/" target="_blank" rel="noopener" data-k="l1"></a></li>
          <li><a href="https://zh.wikipedia.org/wiki/二二八事件" target="_blank" rel="noopener">維基百科：二二八事件</a></li>
          <li><a href="https://en.wikipedia.org/wiki/February_28_incident" target="_blank" rel="noopener">Wikipedia: February 28 incident</a></li>
        </ul>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
// ---------- language (shared with 台灣四百年) ----------
let lang = 'bi';
try { const s = localStorage.getItem('tw400-lang'); if (s==='zh'||s==='en'||s==='bi') lang = s; } catch (e) {}
if (['#zh','#en','#bi'].includes(location.hash)) lang = location.hash.slice(1);
const tx = (zh, en) => lang==='en' ? en : zh;
const UI = {
  back: ['台灣四百年', 'Taiwan: Four Centuries'],
  h1: ['二二八事件 1947', 'The February 28 Incident, 1947'],
  intro: ['1947 年 2 月 27 日台北一場查緝私菸的衝突，在數日內演變為全島抗爭，隨後遭軍隊鎮壓與清鄉。逐日看事件如何蔓延、如何被鎮壓。',
          'On February 27, 1947, a cigarette raid in Taipei turned within days into island-wide protest, then a military crackdown and purges. Follow it day by day.'],
  play: ['播放','Play'], pause: ['暫停','Pause'], replay: ['重播','Replay'],
  speed: ['速度','Speed'], langLbl: ['語言','Language'],
  afterH: ['事件之後', 'After 1947'],
  tollH: ['死亡人數', 'Deaths'],
  toll: ['1992 年行政院《二二八事件研究報告》以人口學方法推估的死亡人數。確切數字至今沒有定論。',
         'The estimate in the Executive Yuan’s 1992 research report, based on demographic analysis. The exact toll is still unknown.'],
  noteH: ['關於這張地圖', 'About this map'],
  note: ['各城市「抗爭」與「鎮壓」日期依研究報告與紀念館資料整理，部分為約略日期；軍隊行進路線為示意，不是精確路徑。',
         'City dates for unrest and crackdown follow the research report and memorial sources; some are approximate. Troop routes are schematic, not exact paths.'],
  moreH: ['延伸閱讀', 'Further reading'],
  l1: ['二二八事件紀念基金會', '228 Memorial Foundation'],
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uiHTML = (zh, en) => lang==='en' ? esc(en) : lang==='bi' ? `${esc(zh)}<span class="en" lang="en">${esc(en)}</span>` : esc(zh);
const setK = (el, k) => { el.innerHTML = uiHTML(UI[k][0], UI[k][1]); };

// ---------- data ----------
const dayOf = md => { const [m,d] = md.split('-').map(Number); return m===2 ? d-27 : m===3 ? d+1 : m===4 ? d+32 : d+62; };
const dateOf = t => { const n=Math.floor(t); return n<2 ? [2,27+n] : n<33 ? [3,n-1] : n<63 ? [4,n-32] : [5,n-62]; };
const MON = ['','January','February','March','April','May'];
const fmtDate = t => { const [m,d]=dateOf(t); return tx(`${m}月${d}日`, `${MON[m]} ${d}`); };
const short = md => { const [m,d]=md.split('-').map(Number); return `${m}/${d}`; };
const D_END = 78;

const CITIES = [
  { k:'taipei',   zh:'台北', en:'Taipei',    p:[121.51,25.05], u:'02-27', c:'03-09' },
  { k:'keelung',  zh:'基隆', en:'Keelung',   p:[121.74,25.13], u:'03-01', c:'03-08' },
  { k:'taoyuan',  zh:'桃園', en:'Taoyuan',   p:[121.30,24.99], side:'l', u:'03-01', c:'03-10' },
  { k:'yilan',    zh:'宜蘭', en:'Yilan',     p:[121.75,24.75], u:'03-02', c:'03-18' },
  { k:'hsinchu',  zh:'新竹', en:'Hsinchu',   p:[120.97,24.80], u:'03-02', c:'03-11' },
  { k:'taichung', zh:'台中', en:'Taichung',  p:[120.68,24.14], u:'03-02', c:'03-12' },
  { k:'puli',     zh:'埔里', en:'Puli',      p:[120.97,23.97], side:'r', u:'03-12', c:'03-16' },
  { k:'chiayi',   zh:'嘉義', en:'Chiayi',    p:[120.45,23.48], u:'03-02', c:'03-11' },
  { k:'tainan',   zh:'台南', en:'Tainan',    p:[120.20,22.99], u:'03-02', c:'03-11' },
  { k:'kaohsiung',zh:'高雄', en:'Kaohsiung', p:[120.29,22.62], u:'03-03', c:'03-06' },
  { k:'pingtung', zh:'屏東', en:'Pingtung',  p:[120.49,22.67], side:'r', u:'03-04', c:'03-08' },
  { k:'hualien',  zh:'花蓮', en:'Hualien',   p:[121.60,23.98], u:'03-04', c:'03-17' },
  { k:'taitung',  zh:'台東', en:'Taitung',   p:[121.14,22.76], u:'03-03', c:'03-17' },
];
for (const c of CITIES) { c.ud = dayOf(c.u) + (c.k==='taipei' ? 0.7 : 0); c.cd = dayOf(c.c); }
const CITY = Object.fromEntries(CITIES.map(c=>[c.k,c]));
const SPOTS = { shuishang:[120.40,23.42] };
const where = k => k ? (CITY[k] ? CITY[k].p : SPOTS[k]) : null;

// troop movements (schematic): from, to, start, arrive, by sea
const ROUTES = [
  ['keelung','taipei','03-08','03-09'], ['taipei','taoyuan','03-09','03-10'], ['taoyuan','hsinchu','03-10','03-11'],
  ['hsinchu','taichung','03-11','03-12'], ['taichung','puli','03-13','03-16'],
  ['kaohsiung','pingtung','03-07','03-08'], ['kaohsiung','tainan','03-10','03-11'], ['tainan','chiayi','03-10','03-11'],
  ['taipei','yilan','03-17','03-18'], ['keelung','hualien','03-14','03-17',true], ['hualien','taitung','03-17','03-18'],
].map(([a,b,s,e,sea])=>({a:CITY[a].p, b:CITY[b].p, s:dayOf(s), e:dayOf(e), sea:!!sea}));

// [date, zh title, en title, zh text, en text, place]
const EVENTS = [
  ['02-27','天馬茶房前緝菸','Cigarette raid at Tianma Teahouse','專賣局查緝員在台北大稻埕查緝私菸，以槍托擊傷菸販林江邁，又開槍擊中旁觀民眾陳文溪，陳翌日身亡。','Monopoly Bureau agents seized contraband cigarettes in Dadaocheng, struck vendor Lin Jiang-mai with a gun butt, and shot bystander Chen Wen-xi, who died the next day.','taipei'],
  ['02-28','長官公署前開槍','Shots at the Chief Executive’s office','請願群眾前往行政長官公署，衛兵以機槍掃射。民眾占領台灣廣播電台，消息傳遍全島。台北宣布戒嚴。','Protesters marched to the Chief Executive’s office and guards fired machine guns into the crowd. People took over the radio station and the news spread island-wide. Taipei was put under martial law.','taipei'],
  ['03-01','抗爭擴及北部','Protest spreads north','基隆、板橋、桃園相繼發生衝突；台北士紳組成「緝菸血案調查委員會」。','Clashes broke out in Keelung, Banqiao and Taoyuan. Taipei civic leaders formed a committee to investigate the shooting.','keelung'],
  ['03-02','二二八事件處理委員會','The 228 Settlement Committee','調查委員會擴大為處理委員會，與長官公署談判。台中、嘉義、台南、宜蘭群眾集會。','The committee grew into the 228 Incident Settlement Committee to negotiate with the government. Crowds rallied in Taichung, Chiayi, Tainan and Yilan.','taichung'],
  ['03-03','嘉義水上機場之戰','Fighting at Shuishang airfield','嘉義民兵包圍水上機場與軍營，雙方對峙。','Militias in Chiayi surrounded Shuishang airfield and army camps.','shuishang'],
  ['03-04','東部與南部響應','The east and south join','高雄、屏東、花蓮、台東相繼成立地方處理委員會。','Local committees formed in Kaohsiung, Pingtung, Hualien and Taitung.','hualien'],
  ['03-06','高雄要塞出兵','The Kaohsiung garrison attacks','高雄要塞司令彭孟緝派兵攻擊市政府與火車站，前往談判的代表遭扣押或殺害。','Garrison commander Peng Meng-chi sent troops against Kaohsiung city hall and the railway station; negotiators were detained or killed.','kaohsiung'],
  ['03-07','三十二條處理大綱','The 32 Demands','處理委員會提出政治改革要求，包括省自治與人權保障，陳儀拒絕。','The Settlement Committee presented demands for political reform, including provincial self-rule and civil rights. Chen Yi rejected them.','taipei'],
  ['03-08','國軍登陸基隆','Troops land at Keelung','整編第二十一師自基隆登陸，沿途開槍掃射。','The Reorganized 21st Division landed at Keelung and fired on people along the way.','keelung'],
  ['03-09','台北再度戒嚴','Martial law again in Taipei','軍隊進入台北展開搜捕。林茂生、陳炘、王添灯等社會菁英在之後數日被帶走，從此失蹤或遇害。','Troops entered Taipei and began arrests. In the following days leading figures such as Lin Mao-sheng, Chen Xin and Wang Tian-deng were taken away and never returned.','taipei'],
  ['03-10','處理委員會被解散','The committee is dissolved','陳儀宣布處理委員會為非法組織，下令解散。','Chen Yi declared the Settlement Committee illegal and ordered it dissolved.','taipei'],
  ['03-12','二七部隊撤往埔里','The 27 Brigade retreats to Puli','台中的民兵「二七部隊」撤入埔里山區。','Taichung’s militia, the 27 Brigade, withdrew into the hills at Puli.','puli'],
  ['03-13','湯德章於台南遇害','Tang De-zhang executed in Tainan','律師湯德章被押至台南市區公開槍決。','Lawyer Tang De-zhang was shot in public in central Tainan.','tainan'],
  ['03-16','烏牛欄之役','Battle of Wuniulan','二七部隊在埔里烏牛欄橋與國軍交戰後解散。','The 27 Brigade fought government troops at Wuniulan Bridge near Puli, then disbanded.','puli'],
  ['03-17','白崇禧來台宣慰','Bai Chongxi arrives','國防部長白崇禧抵台處理善後。','Defense Minister Bai Chongxi arrived to oversee the aftermath.','taipei'],
  ['03-20','清鄉開始','The purges begin','全島展開清鄉：清查戶口、鼓勵密告、連坐處分。','Island-wide purges began: house searches, informants and collective punishment.',null],
  ['03-25','陳澄波於嘉義車站前遇害','Chen Cheng-po executed in Chiayi','畫家、嘉義市參議員陳澄波等人在嘉義火車站前被公開槍決。','Painter and Chiayi councillor Chen Cheng-po and others were shot in front of Chiayi Station.','chiayi'],
  ['04-22','撤銷長官公署','The executive office is abolished','行政院決議撤銷台灣省行政長官公署，改設台灣省政府。','The Executive Yuan abolished the Chief Executive’s office and created a provincial government.',null],
  ['05-16','清鄉結束','The purges end','魏道明就任台灣省政府主席，宣布結束清鄉。','Wei Tao-ming took office as provincial chairman and declared the purges over.','taipei'],
].map(e=>({ d:dayOf(e[0])+(e[0]==='02-27'?0.7:0), md:e[0], tz:e[1], te:e[2], bz:e[3], be:e[4], at:e[5] }));

// [from day, to day, zh, en, color, zh text, en text]
const PHASES = [
  [0,2,'爆發','Outbreak','#e8a33d','查緝私菸引發的衝突，一夜之間演變成對陳儀政府的全面抗議。','A cigarette raid turned overnight into protest against Chen Yi’s whole administration.'],
  [2,9,'擴散與談判','Spread and negotiation','#e3c15c','各地群眾接管機關、組織處理委員會要求改革；長官公署一面談判，一面向南京請兵。','Crowds took over local offices and formed committees demanding reform, while the government negotiated and asked Nanjing for troops.'],
  [9,21,'軍隊鎮壓','Military crackdown','#c8323c','援軍登陸後由北而南掃蕩，大量民眾與地方菁英被殺、被捕或失蹤。','Reinforcements swept from north to south; many civilians and local leaders were killed, arrested or disappeared.'],
  [21,79,'清鄉','Purges','#8a2a3a','以清查戶口、鼓勵密告與連坐方式追捕參與者，恐懼延續成往後數十年的沉默。','Searches, informants and collective punishment hunted down participants; the fear became decades of silence.'],
];
const phaseAt = t => PHASES.find(p => t>=p[0] && t<p[1]) || PHASES[PHASES.length-1];

const AFTER = [
  ['1949','台灣省實施戒嚴，白色恐怖延續 38 年，二二八成為禁忌。','Martial law begins. Through 38 years of White Terror, 228 cannot be spoken of.'],
  ['1987','二二八和平日促進會成立，首度公開要求平反與紀念。','The 228 Peace Day Association forms and publicly calls for redress for the first time.'],
  ['1992','行政院公布《二二八事件研究報告》，推估死亡人數約 18,000 至 28,000 人。','The Executive Yuan’s research report estimates 18,000 to 28,000 deaths.'],
  ['1995','李登輝總統代表政府道歉；《二二八事件處理及賠償條例》通過。','President Lee Teng-hui apologizes for the government, and a compensation law passes.'],
  ['1996','台北新公園更名為二二八和平公園。','Taipei New Park is renamed 228 Peace Park.'],
  ['1997','2 月 28 日訂為國定假日「和平紀念日」；台北二二八紀念館開館。','February 28 becomes a national holiday, Peace Memorial Day, and the Taipei 228 Memorial Museum opens.'],
  ['2006','《二二八事件責任歸屬研究報告》指出蔣中正應負最大責任。','A report on responsibility finds that Chiang Kai-shek bears the greatest responsibility.'],
  ['2011','國家二二八紀念館開館。','The National 228 Memorial Museum opens.'],
  ['2017','《促進轉型正義條例》通過。','The Act on Promoting Transitional Justice passes.'],
  ['2018','促進轉型正義委員會開始撤銷政治案件受難者的有罪判決。','The Transitional Justice Commission begins voiding the convictions of political victims.'],
];

// ---------- map ----------
const COAST = [[121.54,25.30],[121.62,25.24],[121.74,25.15],[121.85,25.11],[121.92,25.03],[121.83,24.90],[121.82,24.75],[121.86,24.59],[121.78,24.42],[121.70,24.28],[121.62,24.02],[121.58,23.85],[121.50,23.60],[121.45,23.38],[121.37,23.15],[121.25,22.92],[121.15,22.75],[121.02,22.58],[120.95,22.45],[120.90,22.30],[120.86,22.10],[120.85,21.92],[120.75,21.93],[120.70,21.95],[120.72,22.10],[120.62,22.30],[120.50,22.45],[120.38,22.52],[120.27,22.62],[120.20,22.78],[120.13,22.95],[120.10,23.10],[120.08,23.30],[120.13,23.50],[120.20,23.75],[120.30,23.95],[120.40,24.15],[120.52,24.35],[120.68,24.58],[120.85,24.80],[120.98,24.95],[121.10,25.05],[121.28,25.12],[121.40,25.18],[121.54,25.30]];
const COS = Math.cos(23.7*Math.PI/180);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function pip(x,y,p){ let inside=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const [xi,yi]=p[i],[xj,yj]=p[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
const SP = 0.034, dots = [];
for (let r=0, lat=25.34; lat>21.88; lat-=SP*0.866, r++)
  for (let lon=119.95+(r%2?SP/COS/2:0); lon<122.0; lon+=SP/COS)
    if (pip(lon,lat,COAST)) {
      const near = [];
      CITIES.forEach((c,i)=>{ const d=Math.hypot((lon-c.p[0])*COS, lat-c.p[1]); if (d<0.42) near.push([i, Math.pow(1-d/0.42,1.4)]); });
      dots.push({ lon, lat, near, cr:51, cg:80, cb:94, ca:0.5 });
    }
const C = { bg:'#08151d', ink:'#ece6d6', muted:'#8fa6b0', faint:'#2a4756', grid:'#16303d' };
const TROOP = hex('#f3e9dc'), BASE = hex('#33505e'), EMBER = hex('#e8a33d'), CRIMSON = hex('#c8323c'), WINE = hex('#6e2333');

function cityState(c, t){
  if (t < c.ud) return [0, 0];
  if (t < c.cd) return [1, smooth(c.ud, c.ud+0.6, t)];
  return [2, 1 - 0.5*clamp((t-c.cd)/12, 0, 1)];
}

// ---------- layout ----------
const cv = document.getElementById('film'), ctx = cv.getContext('2d'), stage = cv.parentElement;
const LAYOUTS = {
  land: { W:1600, H:900, u:1,
    title:{x:56,y:58}, date:{x:52,y:190,size:116}, year:{x:58,y:228}, phase:{x:58,y:288,size:36}, pdesc:{x:58,y:330,w:370,lh:27,max:4},
    event:{x:58,y:490,w:370}, map:{x:450,y:24,w:600,h:800}, table:{x:1100,y:84,w:440,rh:44}, strip:{x:56,y:846,w:1488,h:28} },
  port: { W:720, H:1820, u:1.3,
    title:{x:28,y:50}, date:{x:24,y:150,size:92}, year:{x:30,y:188}, phase:{x:28,y:244,size:32}, pdesc:{x:28,y:284,w:664,lh:30,max:2},
    map:{x:16,y:340,w:688,h:640}, event:{x:28,y:1040,w:664}, table:{x:28,y:1270,w:664,rh:34}, strip:{x:28,y:1760,w:664,h:32} },
};
let L = LAYOUTS.land, M = {};
const LON0=119.75, LON1=122.15, LAT0=21.8, LAT1=25.45;
function setLayout(){
  const cw = stage.clientWidth || 1000;
  L = cw < 720 ? LAYOUTS.port : LAYOUTS.land;
  const scale = Math.min(2, window.devicePixelRatio||1) * cw / L.W;
  cv.width = Math.round(L.W*scale); cv.height = Math.round(L.H*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
  const r=L.map, gw=(LON1-LON0)*COS, gh=LAT1-LAT0;
  M.k=Math.min(r.w/gw, r.h/gh); M.ox=r.x+(r.w-gw*M.k)/2; M.oy=r.y+(r.h-gh*M.k)/2;
  for (const d of dots) [d.x,d.y]=P(d.lon,d.lat);
  M.dot = SP*M.k*0.42;
}
const P = (lon,lat) => [M.ox+(lon-LON0)*COS*M.k, M.oy+(LAT1-lat)*M.k];

// ---------- drawing ----------
const F = { d:'"Noto Serif TC","Songti TC","PMingLiU",serif', b:'"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif', m:'"IBM Plex Mono",Consolas,monospace' };
const font = (w,s,f) => `${w} ${s}px ${f}`;
const rgba = (c,a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a.toFixed(3)})`;
function wrap(text, maxW){
  const toks = text.match(/[\p{Script=Latin}0-9.,;:!?%’'"“”()\/\-–]+|\s|./gu) || [];
  const lines=[]; let line='';
  for (const t of toks) { if (line && ctx.measureText(line+t).width > maxW) { lines.push(line.trimEnd()); line = t.trim() ? t : ''; } else line += t; }
  if (line) lines.push(line); return lines;
}
function fitFont(text, weight, size, family, maxW, min=11){ let s=size; ctx.font=font(weight,s,family); while (s>min && ctx.measureText(text).width>maxW) { s-=1; ctx.font=font(weight,s,family); } }
const lastEvent = t => { let e=null; for (const x of EVENTS) if (x.d<=t) e=x; else break; return e; };

function drawMap(t, dt){
  const r=L.map, u=L.u, f=1-Math.pow(0.002, dt), purge=smooth(21,26,t)*0.28;
  ctx.save(); ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
  ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.font=font(400,11*u,F.m); ctx.fillStyle=C.faint;
  for (let lon=120; lon<=122; lon++) { const [x]=P(lon,0); ctx.beginPath(); ctx.moveTo(x,r.y); ctx.lineTo(x,r.y+r.h); ctx.stroke(); ctx.fillText(`${lon}°E`, x+4, r.y+r.h-8); }
  for (let lat=22; lat<=25; lat++) { const [,yy]=P(0,lat); ctx.beginPath(); ctx.moveTo(r.x,yy); ctx.lineTo(r.x+r.w,yy); ctx.stroke(); ctx.fillText(`${lat}°N`, r.x+6, yy-5); }
  ctx.restore();
  const st = CITIES.map(c=>cityState(c,t));
  for (const d of dots) {
    let best=0, col=BASE;
    for (const [i,w] of d.near) { const [s,k]=st[i]; if (!s) continue; const v=w*k; if (v>best) { best=v; col = s===1 ? EMBER : CRIMSON; } }
    let tr=[BASE[0]+(col[0]-BASE[0])*best, BASE[1]+(col[1]-BASE[1])*best, BASE[2]+(col[2]-BASE[2])*best];
    if (purge) tr = tr.map((v,j)=>v+(WINE[j]-v)*purge*(1-best));
    const ta = 0.45 + 0.5*best;
    d.cr+=(tr[0]-d.cr)*f; d.cg+=(tr[1]-d.cg)*f; d.cb+=(tr[2]-d.cb)*f; d.ca+=(ta-d.ca)*f;
    ctx.fillStyle=`rgba(${d.cr|0},${d.cg|0},${d.cb|0},${d.ca.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,M.dot,0,6.2832); ctx.fill();
  }
  // troop movements
  ctx.lineCap='round';
  for (const rt of ROUTES) {
    if (t < rt.s) continue;
    const p = clamp((t-rt.s)/(rt.e-rt.s), 0, 1), [x0,y0]=P(...rt.a), [x1,y1]=P(...rt.b);
    let xa=x0, ya=y0, xb=x0+(x1-x0)*p, yb=y0+(y1-y0)*p;
    if (rt.sea) { const [cx,cy]=P(122.15,24.4); ctx.strokeStyle=rgba(TROOP,0.9); ctx.lineWidth=2; ctx.setLineDash([3,6]); ctx.beginPath(); ctx.moveTo(x0,y0);
      const q=p; ctx.quadraticCurveTo(x0+(cx-x0)*q, y0+(cy-y0)*q, xb=x0+(x1-x0)*q*q+(cx-x0)*2*q*(1-q), yb=y0+(y1-y0)*q*q+(cy-y0)*2*q*(1-q)); ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.strokeStyle=rgba(hex(C.bg),0.8); ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(xa,ya); ctx.lineTo(xb,yb); ctx.stroke(); ctx.strokeStyle=rgba(TROOP,0.95); ctx.lineWidth=2.2; ctx.stroke(); }
    if (p<1) { const ang=Math.atan2(y1-y0,x1-x0); ctx.fillStyle=rgba(TROOP,1); ctx.beginPath(); ctx.moveTo(xb+Math.cos(ang)*7, yb+Math.sin(ang)*7); ctx.lineTo(xb+Math.cos(ang+2.5)*7, yb+Math.sin(ang+2.5)*7); ctx.lineTo(xb+Math.cos(ang-2.5)*7, yb+Math.sin(ang-2.5)*7); ctx.closePath(); ctx.fill(); }
  }
  // cities
  CITIES.forEach((c,i)=>{
    const [s]=st[i], [x,y]=P(...c.p);
    ctx.fillStyle = s===2 ? '#c8323c' : s===1 ? '#e8a33d' : C.bg; ctx.strokeStyle=C.ink; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,4.5,0,6.2832); ctx.fill(); ctx.stroke();
    const left = c.side ? c.side==='l' : c.p[0] < 120.9, lx=x+(left?-10:10);
    ctx.textAlign = left ? 'right' : 'left'; ctx.font=font(600,13*u,F.b);
    const nm = tx(c.zh, c.en);
    ctx.lineWidth=3.5; ctx.strokeStyle=C.bg; ctx.strokeText(nm, lx, y+4.5); ctx.fillStyle=C.ink; ctx.fillText(nm, lx, y+4.5);
    if (lang==='bi') { ctx.font=font(400,10*u,F.b); ctx.strokeText(c.en, lx, y+4.5+12*u); ctx.fillStyle=C.muted; ctx.fillText(c.en, lx, y+4.5+12*u); }
    ctx.textAlign='left';
  });
  const e = lastEvent(t);
  if (e && e.at && t-e.d < 2) {
    const [x,y]=P(...where(e.at)), ph=(performance.now()/1000)%1;
    ctx.strokeStyle=rgba([255,255,255],(1-ph)*0.85); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,8+ph*28,0,6.2832); ctx.stroke();
  }
  // legend
  const lx=r.x+12, ly=r.y+r.h-74*u;
  [[EMBER,'抗爭','Unrest'],[CRIMSON,'軍隊鎮壓','Crackdown'],[WINE,'清鄉','Purges']].forEach(([c,zh,en],i)=>{
    ctx.fillStyle=rgba(c,1); ctx.beginPath(); ctx.arc(lx+6, ly+i*20*u-4, 5.5, 0, 6.2832); ctx.fill();
    ctx.font=font(500,12.5*u,F.b); ctx.fillStyle=C.ink; ctx.fillText(lang==='bi' ? `${zh} ${en}` : tx(zh,en), lx+18, ly+i*20*u);
  });
  ctx.strokeStyle=rgba(TROOP,0.95); ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(lx, ly+60*u-4); ctx.lineTo(lx+14, ly+60*u-4); ctx.stroke();
  ctx.fillStyle=C.ink; ctx.fillText(lang==='bi' ? '軍隊行進（示意） Troop movement' : tx('軍隊行進（示意）','Troop movement (schematic)'), lx+18, ly+60*u);
}

function drawHeader(t){
  const u=L.u, ph=phaseAt(t), bi=lang==='bi';
  ctx.font=font(700,13*u,F.b); ctx.fillStyle=C.muted;
  ctx.fillText(tx('二 二 八 事 件　1947','THE FEBRUARY 28 INCIDENT   1947'), L.title.x, L.title.y);
  fitFont(fmtDate(t), 900, L.date.size, F.d, 380*u, 40); ctx.fillStyle=C.ink; ctx.fillText(fmtDate(t), L.date.x, L.date.y);
  ctx.font=font(500,17*u,F.d); ctx.fillStyle=C.muted;
  const [m,d]=dateOf(t); ctx.fillText(lang==='bi' ? `${MON[m]} ${d}, 1947` : tx('民國 36 年', '1947'), L.year.x, L.year.y);
  ctx.font=font(900,L.phase.size,F.d); ctx.fillStyle=ph[4]; const pn=tx(ph[2],ph[3]); ctx.fillText(pn, L.phase.x, L.phase.y);
  if (bi) { const w=ctx.measureText(pn).width; ctx.font=font(500,17*u,F.d); ctx.globalAlpha=0.85; ctx.fillText(ph[3], L.phase.x+w+12, L.phase.y); ctx.globalAlpha=1; }
  const pd=L.pdesc; ctx.font=font(400,(lang==='en'?15.5:16.5)*u,F.b); ctx.fillStyle=C.muted;
  wrap(tx(ph[5],ph[6]), pd.w).slice(0,pd.max).forEach((ln,i)=>ctx.fillText(ln, pd.x, pd.y+i*pd.lh));
}

function drawEvent(t){
  const r=L.event, u=L.u, bi=lang==='bi';
  ctx.strokeStyle=C.faint; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(r.x,r.y-24*u); ctx.lineTo(r.x+r.w,r.y-24*u); ctx.stroke();
  ctx.font=font(700,11.5*u,F.b); ctx.fillStyle=C.muted; ctx.fillText(tx('當 日 紀 事','EVENTS')+(bi?'  EVENTS':''), r.x, r.y-4*u);
  const idx = EVENTS.indexOf(lastEvent(t)); if (idx<0) return;
  const e=EVENTS[idx];
  ctx.font=font(600,14*u,F.m); ctx.fillStyle=phaseAt(e.d)[4]; ctx.fillText(short(e.md), r.x, r.y+24*u);
  const title=tx(e.tz,e.te); fitFont(title, 700, 23*u, F.d, r.w-58*u, 14); ctx.fillStyle=C.ink; ctx.fillText(title, r.x+58*u, r.y+25*u);
  let y=r.y+58*u;
  if (bi) { fitFont(e.te, 500, 14*u, F.b, r.w-58*u, 10); ctx.fillStyle=C.muted; ctx.fillText(e.te, r.x+58*u, r.y+45*u); y=r.y+74*u; }
  ctx.font=font(400,(lang==='en'?14.5:15.5)*u,F.b); ctx.fillStyle=C.muted;
  const lines = wrap(tx(e.bz,e.be), r.w).slice(0, L===LAYOUTS.port ? 3 : 5);
  lines.forEach((ln,i)=>ctx.fillText(ln, r.x, y+i*24*u)); y += lines.length*24*u + 22*u;
  // two earlier events, smaller
  for (let j=idx-1; j>=Math.max(0,idx-2) && L===LAYOUTS.land; j--) {
    const p=EVENTS[j]; ctx.globalAlpha=0.6;
    ctx.font=font(600,12.5*u,F.m); ctx.fillStyle=C.muted; ctx.fillText(short(p.md), r.x, y);
    fitFont(lang==='bi' ? `${p.tz} ${p.te}` : tx(p.tz,p.te), 500, 14*u, F.b, r.w-58*u, 10); ctx.fillStyle=C.ink;
    ctx.fillText(lang==='bi' ? `${p.tz} ${p.te}` : tx(p.tz,p.te), r.x+58*u, y); y += 24*u; ctx.globalAlpha=1;
  }
}

function drawTable(t){
  const r=L.table, u=L.u, bi=lang==='bi', c1=r.x+24*u, c2=r.x+r.w*0.56, c3=r.x+r.w*0.80;
  ctx.font=font(700,14*u,F.b); ctx.fillStyle=C.ink; ctx.fillText(tx('各地情勢','City by city'), r.x, r.y-34*u);
  if (bi) { const w=ctx.measureText('各地情勢').width; ctx.font=font(400,12*u,F.b); ctx.fillStyle=C.muted; ctx.fillText('City by city', r.x+w+8, r.y-34*u); }
  ctx.font=font(600,11.5*u,F.b); ctx.fillStyle=C.muted;
  ctx.fillText(tx('城市','City'), c1, r.y-10*u); ctx.fillText(lang==='bi'?'抗爭 Unrest':tx('抗爭','Unrest'), c2, r.y-10*u); ctx.fillText(lang==='bi'?'鎮壓 Crackdown':tx('鎮壓（約）','Crackdown'), c3, r.y-10*u);
  ctx.strokeStyle=C.faint; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(r.x, r.y-2*u); ctx.lineTo(r.x+r.w, r.y-2*u); ctx.stroke();
  CITIES.forEach((c,i)=>{
    const y=r.y+(i+0.7)*r.rh, [s,k]=cityState(c,t);
    ctx.fillStyle = s===2 ? '#c8323c' : s===1 ? '#e8a33d' : C.faint; ctx.globalAlpha = s ? 0.5+0.5*k : 1;
    ctx.beginPath(); ctx.arc(r.x+7*u, y-5*u, 6*u, 0, 6.2832); ctx.fill(); ctx.globalAlpha=1;
    ctx.font=font(600,15*u,F.b); ctx.fillStyle = s ? C.ink : C.muted; const nm=tx(c.zh,c.en); ctx.fillText(nm, c1, y);
    if (bi) { const w=ctx.measureText(nm).width; ctx.font=font(400,11.5*u,F.b); ctx.fillStyle=C.muted; ctx.fillText(c.en, c1+w+8, y); }
    ctx.font=font(500,14*u,F.m);
    ctx.fillStyle = s>=1 ? '#e8a33d' : C.faint; ctx.fillText(short(c.u), c2, y);
    ctx.fillStyle = s===2 ? '#e06a70' : C.faint; ctx.fillText(short(c.c), c3, y);
    ctx.strokeStyle=C.grid; ctx.beginPath(); ctx.moveTo(r.x, y+r.rh*0.3); ctx.lineTo(r.x+r.w, y+r.rh*0.3); ctx.stroke();
  });
}

const sx = (r,t) => r.x + r.w*(t<=24 ? 0.7*t/24 : 0.7+0.3*(t-24)/(D_END-24));
function drawStrip(t){
  const r=L.strip, u=L.u;
  for (const p of PHASES) {
    const x0=sx(r,p[0]), x1=sx(r,Math.min(p[1],D_END)), on = t>=p[0] && t<p[1];
    ctx.fillStyle=p[4]; ctx.globalAlpha = on ? 0.95 : 0.35; ctx.fillRect(x0, r.y, x1-x0-1.5, r.h); ctx.globalAlpha=1;
    ctx.font=font(700,12.5*u,F.b); ctx.fillStyle = on ? '#14090a' : C.ink;
    let lb = lang==='bi' ? `${p[2]} ${p[3]}` : tx(p[2],p[3]); if (ctx.measureText(lb).width > x1-x0-10) lb = tx(p[2],p[3]);
    if (ctx.measureText(lb).width < x1-x0-10) ctx.fillText(lb, x0+6, r.y+r.h/2+4.5*u);
  }
  ctx.font=font(400,10.5*u,F.m); ctx.fillStyle=C.muted;
  for (const md of ['03-01','03-08','03-15','04-01','05-01']) { const x=sx(r,dayOf(md)); ctx.fillRect(x, r.y+r.h, 1, 5); ctx.fillText(short(md), x+3, r.y+r.h+15*u); }
  ctx.fillStyle=C.ink; ctx.globalAlpha=0.55; for (const e of EVENTS) { const x=sx(r,e.d); ctx.fillRect(x-0.5, r.y-6, 1, 4); } ctx.globalAlpha=1;
  const x=sx(r,t); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.moveTo(x-6,r.y-10); ctx.lineTo(x+6,r.y-10); ctx.lineTo(x,r.y-2); ctx.closePath(); ctx.fill(); ctx.fillRect(x-1,r.y-2,2,r.h+4);
}

function render(t, dt){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,L.W,L.H);
  drawMap(t, dt); drawHeader(t); drawEvent(t); drawTable(t); drawStrip(t);
}

// ---------- playback ----------
const playBtn=document.getElementById('play'), scrub=document.getElementById('scrub'), out=document.getElementById('dayOut'), speedSel=document.getElementById('speed');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let day=0, playing=!reduce, last=performance.now();
const rate = t => t<24 ? 0.9 : 6;
function setPlaying(p){ playing=p; setK(playBtn, p ? 'pause' : (day>=D_END ? 'replay' : 'play')); }
function seek(t){ day=clamp(t,0,D_END); scrub.value=day; const [m,d]=dateOf(day); out.textContent=`${m}/${d}`; }
playBtn.addEventListener('click', ()=>{ if (!playing && day>=D_END) seek(0); setPlaying(!playing); });
scrub.addEventListener('input', ()=>{ seek(+scrub.value); if (playing) setPlaying(false); });
document.addEventListener('keydown', e=>{
  if (e.target.matches('input,select') && e.key!==' ') return;
  if (e.key===' ') { e.preventDefault(); playBtn.click(); }
  else if (e.key==='ArrowRight') seek(Math.floor(day)+1);
  else if (e.key==='ArrowLeft') seek(Math.floor(day)-1);
});
const afterOl=document.getElementById('after');
function applyLang(){
  document.documentElement.lang = lang==='en' ? 'en' : 'zh-Hant';
  document.title = tx('二二八事件 1947', 'The February 28 Incident, 1947');
  document.querySelectorAll('[data-k]').forEach(el=>setK(el, el.dataset.k));
  const back=document.querySelector('.back'); back.innerHTML = '← ' + back.innerHTML;
  setPlaying(playing);
  afterOl.innerHTML = AFTER.map(([y,zh,en])=>`<li><b>${y}</b><span>${uiHTML(zh,en)}</span></li>`).join('');
  for (const [id,l] of [['langZh','zh'],['langEn','en'],['langBi','bi']]) document.getElementById(id).setAttribute('aria-pressed', lang===l);
  cv.setAttribute('aria-label', tx('二二八事件逐日地圖動畫','Day-by-day map animation of the February 28 Incident'));
}
function setLang(l){ lang=l; try { localStorage.setItem('tw400-lang', l); } catch (e) {} applyLang(); }
document.getElementById('langZh').addEventListener('click', ()=>setLang('zh'));
document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));
document.getElementById('langBi').addEventListener('click', ()=>setLang('bi'));

function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (playing) { day += dt*rate(day)*(+speedSel.value); if (day>=D_END) { day=D_END; setPlaying(false); } scrub.value=day; const [m,d]=dateOf(day); out.textContent=`${m}/${d}`; }
  render(day, dt); requestAnimationFrame(frame);
}
new ResizeObserver(()=>setLayout()).observe(stage);
setLayout(); applyLang(); seek(0); setPlaying(playing);
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
